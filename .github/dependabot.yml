# ABOUTME: Keeps the site's npm packages and GitHub Actions dependencies current.
# ABOUTME: Opens bounded weekly update pull requests against the repository root.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # @astrojs/check declares typescript ^5 || ^6 as its peer; a TypeScript major
      # waits until it supports the next one.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
